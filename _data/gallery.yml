- image: f20204416.jpg
  caption: "נאייפיר, ניו זילנד 2025 - היינו בסיור במושבת סולות. הרגע שתפסתי הוא ריקוד זוגי של שתי הציפורים בתהליך החלפת המשמרות על הגוזל. האמא מקוננת על הגוזל שלה בזמן שהזכר אוסף אוכל. כאשר הזכר חוזר עם המזון בגרונו מבוצע טקס ההחלפה שבו הציפורים מחכחות את המקורות שלהן זה בזה ובסופו האמא מפנה את הקן עבור להאכלה.  "
